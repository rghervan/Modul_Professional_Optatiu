<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Exercici 3</title>
</head>
<body>
    <h1>Nombres senars</h1>

    <label>Introdueix un nombre:</label>
    <input type="number" id="num">

    <button onclick="mostrar()">Mostrar</button>

    <div id="resultat"></div>

    <script>
        function mostrar() {
            let n = parseInt(document.getElementById("num").value);
            let out = [];

            for (let i = 1; i <= n; i += 2) {
                out.push(i);
            }

            document.getElementById("resultat").textContent = out.join(", ");
        }
    </script>
</body>
</html>
