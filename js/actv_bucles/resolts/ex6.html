<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Exercici 6</title>
</head>
<body>
    <h1>Triangle d'estrelles</h1>

    <label>Introdueix un nombre:</label>
    <input type="number" id="num">

    <button onclick="mostrar()">Mostrar</button>

    <pre id="resultat"></pre>

    <script>
        function mostrar() {
            let n = parseInt(document.getElementById("num").value);
            let out = "";

            for (let i = 1; i <= n; i++) {
                out += "*".repeat(i) + "\n";
            }

            document.getElementById("resultat").textContent = out;
        }
    </script>
</body>
</html>
