<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="micanvas" width="500" height="300" style="border:2px solid black;"></canvas>

    <script>
        let ctx=document.getElementById("micanvas").getContext("2d");
        //Rectangulo
        ctx.fillStyle = "black";
        ctx.fillRect(20,20,120,60); // x,y,ancho,alto

        //triangulo
        ctx.beginPath();
        ctx.fillStyle = "black";
        ctx.moveTo(200,20); // punto superior
        ctx.lineTo(170,80); // esquina izquierda
        ctx.lineTo(230, 80); // esquina derecha
        ctx.closePath();
        ctx.fill();

        //

    </script>
</body>
</html>
