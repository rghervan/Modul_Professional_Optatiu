<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figuras Canvas</title>
</head>
<body>
<canvas id="miCanvas" width="600" height="400" style="border:1px solid black;"></canvas>

<script>
let ctx = document.getElementById("miCanvas").getContext("2d");

//
// 1) RECTÁNGULO
//
ctx.fillStyle = "red";
ctx.fillRect(20, 20, 120, 60);   // x, y, ancho, alto

//
// 2) TRIÁNGULO
//
ctx.beginPath();
ctx.fillStyle = "blue";
ctx.moveTo(200, 20);   // punto superior
ctx.lineTo(150, 100);  // esquina izquierda
ctx.lineTo(250, 100);  // esquina derecha
ctx.closePath();
ctx.fill();

//
// 3) ELIPSE
//
ctx.beginPath();
ctx.fillStyle = "green";
ctx.ellipse(400, 70, 80, 40, 0, 0, Math.PI * 2); // x, y, radioX, radioY
ctx.fill();

//
// 4) ESTRELLA 
ctx.beginPath();
ctx.fillStyle = "black";

// Punto inicial (arriba)
ctx.moveTo(250, 50);

// Siguiente punta
ctx.lineTo(270, 100);

// Siguiente
ctx.lineTo(320, 100);

// Siguiente
ctx.lineTo(280, 130);

// Siguiente
ctx.lineTo(300, 180);

// Siguiente
ctx.lineTo(250, 150);

// Siguiente
ctx.lineTo(200, 180);

// Siguiente
ctx.lineTo(220, 130);

// Siguiente
ctx.lineTo(180, 100);

// Último
ctx.lineTo(230, 100);

ctx.closePath();
ctx.fill();

</script>
</body>
</html>
