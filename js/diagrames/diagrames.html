<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrames</title>
</head>
<body>
    <canvas id="miCanvas" width="500" height="300" style="border: 1px solid black;"></canvas>

<script>
  let canvas = document.getElementById("miCanvas");
  let ctx = canvas.getContext("2d");
 //valors rodona
  let x1 = 250;
  let y1 = 200;
  let radi1 = 90;
  // Rectangle 1
  ctx.fillStyle = "rgba(135, 206, 235, 1)";
    ctx.fillRect(0, 0, 700, 200);

  // Rectangle 2
  ctx.fillStyle = "rgba(0, 0, 128, 1)";
  ctx.fillRect(0, 200, 700, 100);
  
  ctx.fillStyle = "rgba(194, 178, 128, 1)";
  

  
  ctx.beginPath();
  ctx.strokeStyle = "wheat";
  ctx.fillStyle = "wheat"
  ctx.ellipse(250, 220, 150, 45,0 , 0, 2 * Math.PI);
  ctx.closePath();
  ctx.fill();
  
  //Arbol copa
  ctx.beginPath();
  ctx.fillStyle="green";
  ctx.ellipse(129,150, 19, 30,0 , Math.PI, 2*Math.PI);
  ctx.fill();
  //Arbol tronco
  ctx.fillStyle="#5C4033"
  ctx.fillRect(125,155,10,50)

//Casa techo
ctx.fillStyle="red";
ctx.beginPath();
ctx.moveTo(250, 90);
ctx.lineTo(200,120);
ctx.lineTo(300,120);
ctx.closePath();
ctx.fill();
// circulo 
ctx.beginPath();
ctx.arc(250,110,10,0,2*Math.PI);
 ctx.fillStyle="blue";
 ctx.fill();
ctx.stroke();
ctx.closePath();

 // ctx.fillRect(200,100, 220,150);

  //ctx.fill();
</script>
</body>
