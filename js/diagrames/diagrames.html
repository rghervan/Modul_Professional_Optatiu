<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrames</title>
</head>
<body>
    <canvas id="miCanvas" width="500" height="300" style="border: 1px solid black;"></canvas>

<script>
  let canvas = document.getElementById("miCanvas");
  let ctx = canvas.getContext("2d");
  let x1 = 200;
  let y1 = 4;
  let radi1 = 50;
   ctx.fillStyle = "rgba(135, 206, 235, 1)";
  // Dibuixar rectangle (x=50, y=50, amplada=150, alçada=100)
  ctx.fillRect(0, 0, 700, 200);

  // Definir color vermell semitransparent
  ctx.fillStyle = "rgba(0, 0, 128, 1)";
  ctx.fillRect(0, 200, 700, 100);
  
  ctx.fillStyle = "rgba(194, 178, 128, 1)";
  ctx.arc(x1, y1, radi1, 0, Math.PI * 2);
  

  ctx.lineWidth = 5;
  ctx.strokeStyle = "green";
  ctx.stroke();             // ✔️ Dibuixa la vora
</script>
</body>
</html>
